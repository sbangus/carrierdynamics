name: Device physics ROOT analysis

on:
  pull_request:
    branches:
      - main
    paths:
      - analysis/inventory_root_outputs.py
      - analysis/generate_device_physics_figures.py
      - .github/workflows/device-physics-root-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  ROOT_FILES: >-
    build/bare-detector-2_2MeV-gamma.root,
    build/bare-detector-662keV-gamma.root,
    build/bare-detector-DD-neutron.root,
    build/bare-detector-DT-neutron.root,
    build/bare-detector-thermal-fast-noB4C.root,
    build/bare-detector-thermal-fast-withB4C.root,
    build/bare-detector-thermal-only.root

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository without LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Download only requested ROOT files
        run: |
          git lfs install --local
          git lfs pull --include="${ROOT_FILES//, /,}" --exclude=""
          ls -lh build/bare-detector-2_2MeV-gamma.root \
                 build/bare-detector-662keV-gamma.root \
                 build/bare-detector-DD-neutron.root \
                 build/bare-detector-DT-neutron.root \
                 build/bare-detector-thermal-fast-noB4C.root \
                 build/bare-detector-thermal-fast-withB4C.root \
                 build/bare-detector-thermal-only.root

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib uproot awkward

      - name: Inventory ROOT objects
        run: python analysis/inventory_root_outputs.py

      - name: Generate thesis figures
        run: python analysis/generate_device_physics_figures.py

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: device-physics-root-inventory
          path: root_inventory/
          if-no-files-found: error
          retention-days: 7

      - name: Upload thesis figure package
        uses: actions/upload-artifact@v4
        with:
          name: device-physics-thesis-figures
          path: |
            device_physics_figures/
            device_physics_thesis_figure_package.zip
          if-no-files-found: error
          retention-days: 7
