name: DD Pb device physics figures

on:
  pull_request:
    branches: [main]
    paths:
      - analysis/generate_dd_pb_device_physics_figures.py
      - .github/workflows/dd-pb-device-physics-figures.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository without LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Fetch requested ROOT files through Git LFS
        run: |
          git lfs install --local
          git lfs pull --include="build/DD-without-Pb.root,build/DD-with-Pb.root" --exclude=""
          ls -lh build/DD-without-Pb.root build/DD-with-Pb.root

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib uproot awkward

      - name: Generate figures
        run: python analysis/generate_dd_pb_device_physics_figures.py

      - name: Upload figure package
        uses: actions/upload-artifact@v4
        with:
          name: dd-pb-device-physics-figures
          path: |
            dd_pb_device_physics_figures/
            dd_pb_device_physics_figure_package.zip
          if-no-files-found: error
          retention-days: 7
